# EXEMPLO — nunca aplicado pelo deploy nem pelo job kind (ambos aplicam os
# manifestos arquivo a arquivo). O Secret real é criado pelo step
# "New Relic — Secret da API (Secrets Manager -> k8s)" do deploy.yml, a partir
# da chave NR_LICENSE_KEY do JSON do Secrets Manager `tech-challenge-fiap/api`
# (var `newrelic_license_key` do repositório infra-db).
#
# Para dev local com New Relic: copie, troque o valor e aplique à mão.
#   NR_LICENSE_KEY — License Key do New Relic (one.newrelic.com > API Keys > INGEST - LICENSE)
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  NR_LICENSE_KEY: "<substituir>"
